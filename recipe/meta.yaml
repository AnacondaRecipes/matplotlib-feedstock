# Full credit goes to https://github.com/conda/conda-recipes for providing this recipe.
# It has been subsequently adapted for automated building with conda-forge.
{% set name = "matplotlib" %}
{% set version = "3.11.2" %}

package:
  name: {{ name }}-suite
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 14b555ae7477ff593d842fba9714b5cbc6ea1db9461d2ea9d6da3ec0dc420f1a

build:
  number: 1

requirements:
  host:
    - python

outputs:
  - name: {{ name }}-base
    script: build_base.bat  # [win]
    script: build_base.sh  # [not win]
    build:
      skip: true  # [py<311]

    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - pkg-config
        - ninja-base
      host:
        - pip
        - python
        - freetype {{ freetype }}
        - numpy {{ numpy }}
        - setuptools_scm >=7,<10
        - setuptools >=64
        - pybind11 >=2.13.2,!=2.13.3
        - meson-python >=0.13.2,!=0.17.*
        - python-build
      run:
        - python
        - contourpy >=1.0.1
        - cycler >=0.10
        - fonttools >=4.28.2
        # kiwisolver has no Python 3.15 build on Windows ARM64 yet.
        - kiwisolver >=1.3.1  # [not (win and arm64 and py>=315)]
        - numpy >=1.25
        - packaging >=20.0
        - pillow >=9
        - pyparsing >=3
        - python-dateutil >=2.7
    test:
      imports:
        - matplotlib  # [not (win and arm64 and py>=315)]
        - matplotlib.pyplot  # [not (win and arm64 and py>=315)]
        - matplotlib._c_internal_utils  # [not (win and arm64 and py>=315)]
        - matplotlib._image  # [not (win and arm64 and py>=315)]
        - matplotlib._path  # [not (win and arm64 and py>=315)]
        - matplotlib._qhull  # [not (win and arm64 and py>=315)]
        - matplotlib._tri  # [not (win and arm64 and py>=315)]
        - matplotlib.backends._backend_agg  # [not (win and arm64 and py>=315)]
        - matplotlib.ft2font  # [not (win and arm64 and py>=315)]
        - matplotlib.backends._tkagg  # [not win]
        - mpl_toolkits  # [not (win and arm64 and py>=315)]
        - pylab  # [not (win and arm64 and py>=315)]
        - matplotlib.cbook  # [not (win and arm64 and py>=315)]
      requires:
        - pip
      commands:
        - pip check  # [not (win and arm64 and py>=315)]
        - python -c "import matplotlib; matplotlib.cbook.get_sample_data('msft.csv', asfileobj=False)"  # [not (win and arm64 and py>=315)]

  - name: {{ name }}
    build:
      skip: true  # [py<311]

    requirements:
      host:
        - python
        - pyqt {{ pyqt }}
      run:
        - python
        - pyqt >=5  # [(linux64 or win) and python_impl == "cpython"]
        - tornado >=5
        - {{ pin_subpackage('matplotlib-base', max_pin="x.x.x") }}
    test:
      imports:
        - matplotlib

about:
  home: https://matplotlib.org
  license: LicenseRef-PSF-based
  license_family: PSF
  license_file: LICENSE/LICENSE
  summary: Publication quality figures in Python
  description: |
    Matplotlib produces publication-quality figures in a variety of hardcopy formats
    and interactive environments across platforms. Matplotlib can be used in
    Python scripts, Python/IPython shells, web application servers,
    and various graphical user interface toolkits.
  dev_url: https://github.com/matplotlib/matplotlib
  doc_url: https://matplotlib.org

extra:
  recipe-maintainers:
    - mdboom
    - ocefpaf
    - pelson
    - tacaswell
    - dopplershift
